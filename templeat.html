<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="board" style="width: 400px"></div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script>
    var board = Chessboard('board', 'start');
    var game = new Chess();
    var onDragStart = function(source, piece, position, orientation) { /* optional validation */ };
    var onDrop = function(source, target) {
        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        var move_uci = move.from + move.to + (move.promotion ? move.promotion : '');
        $.post('/move', { move: move_uci }, function(response) {
        game.load(response.fen);
        board.position(game.fen());
        });
    };
    board = Chessboard('board', {
        position: 'start',
        draggable: true,
        onDragStart: onDragStart,
        onDrop: onDrop
    });
    </script>
</body>
</html>
